name: Check RR standalone

on:
  workflow_dispatch:
  push:
    branches: [main, rr-standalone-check]
    paths:
      - rr-test/standalone.zip
      - rr-test/README.md
      - rr-test/run-final.R
      - rr-test/standalone.Makefile
      - ci/check-rr-standalone.R
      - .github/workflows/check-rr-standalone.yml

permissions:
  contents: read

env:
  RR_STANDALONE_ZIP_SHA256: 84bcdea98290ed93d979bbdea3033d7d0b4de141a478572d958cc9745b8dde0d

jobs:
  native:
    name: Saved-PAR outputs (no optimisation, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check preserved files before evaluation
        run: python3 ci/verify-preserved-files.py
      - name: Check 20 saved models without optimisation
        run: >-
          Rscript ci/check-rr-standalone.R --shard ${{ matrix.shard }}
          --work-parent "$RUNNER_TEMP"
          --proof-dir "$RUNNER_TEMP/rr-standalone-proof-${{ matrix.shard }}"
      - name: Check preserved files after evaluation
        if: always()
        run: python3 ci/verify-preserved-files.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rr-standalone-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/rr-standalone-proof-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
  all-60:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check preserved files before aggregation
        run: python3 ci/verify-preserved-files.py
      - uses: actions/download-artifact@v4
        with:
          pattern: rr-standalone-shard-*
          path: ${{ runner.temp }}/rr-standalone-shards
      - name: Require all 60 saved cases
        env:
          NATIVE_MATRIX_RESULT: ${{ needs.native.result }}
        run: >-
          Rscript ci/check-rr-standalone.R
          --aggregate "$RUNNER_TEMP/rr-standalone-shards"
          --proof-dir "$RUNNER_TEMP/rr-standalone-all-60"
      - name: Check preserved files after aggregation
        if: always()
        run: python3 ci/verify-preserved-files.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rr-standalone-all-60
          path: ${{ runner.temp }}/rr-standalone-all-60
          retention-days: 14
          if-no-files-found: warn
