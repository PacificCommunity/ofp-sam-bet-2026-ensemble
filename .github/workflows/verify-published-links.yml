name: Verify published report links

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check preserved report paths, local dependencies and README anchors
        run: python3 scripts/verify-published-report-links.py
