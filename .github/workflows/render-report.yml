name: Render BET 2026 ensemble report

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "data/ensemble/**"
      - "data/estimation/**"
      - "data/diagnostic/**"
      - "data/projection/**"
      - "design/**"
      - "final-par/**"
      - "final-par-rr-inclusion-flag2-0/**"
      - "final-par-rr-exclusion-flag2-1/**"
      - "report/**"
      - "scripts/**"
      - "run-report"
      - ".github/workflows/render-report.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ensemble-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    container:
      image: ghcr.io/pacificcommunity/tuna-flow-private:v2.7@sha256:4fee4c40cb6439ff920b1dd233a84bf19d5cc0e37278c99ceff3fd79cb9c8852
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify TunaFlow 2.7 report runtime
        run: Rscript -e 'required <- c("ggplot2", "patchwork", "ragg", "scales", "jsonlite", "MASS"); stopifnot(all(vapply(required, requireNamespace, logical(1), quietly = TRUE)))'

      - name: Validate and render from the frozen public payload
        run: ./run-report

      - name: Verify browser-ready report, viewer and PNGs
        shell: bash
        run: |
          test -s results/bet-2026-ensemble-report.html
          test -s results/bet-2026-ensemble-interactive-viewer.html
          test -s results/report-manifest.csv
          test -s results/figures/natural-mortality-evidence.png
          test -s results/figures/projection-stock-trajectories.png
          test -s results/rr-sensitivity/tables/group-counts-qc.csv
          test -s results/rr-sensitivity/tables/differences-vs-combined.csv
          test -s results/bet-2026-ensemble-report-rr0-inclusion.html
          test -s results/bet-2026-ensemble-report-rr1-exclusion.html
          test "$(find results/rr-sensitivity/tables -maxdepth 1 -name '*.csv' -type f | wc -l)" -eq 32
          test "$(find results/rr-sensitivity/figures -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 23
          test "$(find results/rr-sensitivity/figures -maxdepth 1 -name '*.pdf' -type f | wc -l)" -eq 23
          test "$(find results/figures -maxdepth 1 -name '*.png' -type f | wc -l)" -ge 10
          grep -q 'data:image/png;base64,' results/bet-2026-ensemble-report.html
          grep -q 'Reporting-rate retained-subset sensitivity' results/bet-2026-ensemble-report.html
          grep -q 'Reporting-rate analysis scope' results/bet-2026-ensemble-interactive-viewer.html
          grep -q '34 equal-weight retained models' results/bet-2026-ensemble-report-rr0-inclusion.html
          grep -q '46 equal-weight retained models' results/bet-2026-ensemble-report-rr1-exclusion.html
          grep -q 'Estimation uncertainty is unavailable for the Near-PDH fits' results/bet-2026-ensemble-report-rr0-inclusion.html
          grep -q 'Projection uncertainty excludes Hessian parameter draws' results/bet-2026-ensemble-report-rr1-exclusion.html
          grep -q 'pacificcommunity.github.io/ofp-sam-bet-2026-ensemble/bet-2026-ensemble-interactive-viewer.html' results/bet-2026-ensemble-report.html
          ! grep -q 'releases/latest/download/bet-2026-ensemble-interactive-viewer.html' results/bet-2026-ensemble-report.html

      - name: Prepare GitHub Pages root
        if: github.ref == 'refs/heads/main'
        run: install -m 0644 results/bet-2026-ensemble-interactive-viewer.html results/index.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: bet-2026-ensemble-report
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: results

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Trigger Rev.01 assessment-report refresh
        env:
          REPORT_REPO_DISPATCH_TOKEN: ${{ secrets.REPORT_REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$REPORT_REPO_DISPATCH_TOKEN" ]; then
            echo "REPORT_REPO_DISPATCH_TOKEN is not configured; the assessment report was not triggered."
            exit 0
          fi
          payload=$(jq -nc \
            --arg sha "$GITHUB_SHA" \
            '{event_type:"ensemble-report-updated",client_payload:{sha:$sha}}')
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $REPORT_REPO_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            https://api.github.com/repos/PacificCommunity/ofp-sam-bet-2026-report/dispatches

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bet-2026-ensemble-report
          path: release/report
      - name: Build report bundle
        run: (cd release/report && zip -q -r ../bet-2026-ensemble-report-${{ github.ref_name }}.zip .)
      - name: Publish report release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/report/bet-2026-ensemble-interactive-viewer.html
            release/report/bet-2026-ensemble-report.html
            release/report/report-manifest.csv
            release/bet-2026-ensemble-report-${{ github.ref_name }}.zip
