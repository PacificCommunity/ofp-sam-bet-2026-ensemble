name: Verify preserved BET results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check preserved inputs and results
        shell: bash
        run: |
          python3 ci/verify-preserved-files.py
          (cd data/ensemble && sha256sum -c SHA256SUMS)
          (cd data/estimation && sha256sum -c SHA256SUMS)
          (cd data/estimation && sha256sum -c PER_MODEL_SHA256SUMS)
          (cd data/estimation && sha256sum -c EQUILIBRIUM_PER_MODEL_SHA256SUMS)
          (cd data/diagnostic && sha256sum -c SHA256SUMS)
          (cd data/projection && sha256sum -c SHA256SUMS)
          (cd data/projection && sha256sum -c PER_MODEL_SHA256SUMS)
          Rscript report/validate.R
          python3 rr-test/verify-results.py
          Rscript rr-test/validate.R
          Rscript rr-test/summarize.R "$RUNNER_TEMP/bet-rr-summary"
          python3 rr-test/verify-results.py --rebuilt-root "$RUNNER_TEMP/bet-rr-summary"
          python3 -m unittest discover -s ci -p 'test_*.py' -v
          git diff --exit-code
  native-rr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Regenerate all 110 completed saved models
        shell: bash
        run: |
          runtime="$RUNNER_TEMP/bet-mfcl"
          mkdir "$runtime"
          curl --fail --location --retry 2 --output "$runtime/mfclo64" https://raw.githubusercontent.com/PacificCommunity/ofp-sam-bet-2026-jitter/bb3f4016b2d145f42c7a76072ed2b10b49aff71f/data/diagnostic/mfcl/mfclo64
          printf '%s  %s\n' f5bc1e232a86e51f920bce7271d8e0930d0b160e4d18dc46de44078f0fa24cd0 "$runtime/mfclo64" | sha256sum -c -
          chmod +x "$runtime/mfclo64"
          python3 ci/regenerate-rr.py "$runtime/mfclo64" "$RUNNER_TEMP/bet-rr-evaluated"
          git diff --exit-code
