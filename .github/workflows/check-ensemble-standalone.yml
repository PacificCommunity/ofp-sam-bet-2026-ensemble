name: Check ensemble standalone

on:
  workflow_dispatch:
  push:
    branches: [main, ensemble-standalone-check]
    paths:
      - reproduce/standalone.zip
      - reproduce/README.md
      - reproduce/run-final.R
      - reproduce/standalone.Makefile
      - ci/check-rr-standalone.R
      - .github/workflows/check-ensemble-standalone.yml

permissions:
  contents: read

env:
  ENSEMBLE_STANDALONE_ZIP_SHA256: 0f367a408e3cc83e24400966317ff1d7f67c995b1396cf2f5fe9e259c51709db

jobs:
  native:
    name: Saved-PAR outputs (no optimisation, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check preserved files before evaluation
        run: python3 ci/verify-preserved-files.py
      - name: Check 20 saved models without optimisation
        run: >-
          Rscript ci/check-rr-standalone.R --family ensemble --shard ${{ matrix.shard }}
          --work-parent "$RUNNER_TEMP"
          --proof-dir "$RUNNER_TEMP/ensemble-standalone-proof-${{ matrix.shard }}"
      - name: Check preserved files after evaluation
        if: always()
        run: python3 ci/verify-preserved-files.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ensemble-standalone-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ensemble-standalone-proof-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: warn
  all-80:
    needs: native
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Check preserved files before aggregation
        run: python3 ci/verify-preserved-files.py
      - uses: actions/download-artifact@v4
        with:
          pattern: ensemble-standalone-shard-*
          path: ${{ runner.temp }}/ensemble-standalone-shards
      - name: Require all 80 saved cases
        env:
          NATIVE_MATRIX_RESULT: ${{ needs.native.result }}
        run: >-
          Rscript ci/check-rr-standalone.R --family ensemble
          --aggregate "$RUNNER_TEMP/ensemble-standalone-shards"
          --proof-dir "$RUNNER_TEMP/ensemble-standalone-all-80"
      - name: Check preserved files after aggregation
        if: always()
        run: python3 ci/verify-preserved-files.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ensemble-standalone-all-80
          path: ${{ runner.temp }}/ensemble-standalone-all-80
          retention-days: 14
          if-no-files-found: warn
