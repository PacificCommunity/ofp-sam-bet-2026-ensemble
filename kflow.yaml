name: bet-2026-ensemble-tau
description: BET 2026 Diagnostic ensemble from Job 21641; ordinary makepar with no fitted seed; 100 independent Suva fits varying h, fixed tag tau, tag mixing, tag reporting, M and effort creep.
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'
resources:
  cpus: 2
  memory: 8GB
  disk: 20GB
exclude_machines: []
exclude_slots: []
env:
  ENSEMBLE_SELECT: ensemble-001
  PROGRAM_PATH: /home/mfcl/mfclo64
  BET_PHASE10_11_CONVERGENCE: "-4"
  TUNA_FLOW_RUNTIME_UPDATE: never
tags:
  stage: ensemble
  species: BET
  assessment_year: "2026"
  reference_model: Job-21641-Diagnostic
output_patterns:
  - outputs/**
metadata:
  reference_model: Diagnostic Job 21641
  source_job: 21641
  tau_levels: [1.2, 1.3, 1.4]
  tau_counts: [33, 34, 33]
  selectivity_model: Diagnostic
  initialization: ordinary-makepar-no-seed
  model_count: 100
  execution: independent-concurrent
  pairing: random-frozen-v1
  maximum_absolute_spearman: 0.076428
  convergence: 1e-4
  inputs: frozen-and-preflight-verified
  changes_from_previous: Fixed-tau=2 ensemble plus one structural axis; tau fixed at 1.2, 1.3 or 1.4 in 33, 34 and 33 fits; all other axes and Diagnostic controls retained
  tag_mixing_source_branch: SC22-IP10-regionMean
  tag_mixing_source_commit: efe3107c72774ee73b5e6dc45e44cf51f0fc20e8
