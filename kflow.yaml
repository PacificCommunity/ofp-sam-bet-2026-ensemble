name: bet-2026-ensemble
description: BET 2026 Job 21641 tau=2/F2 structural ensemble; 100 independently fitted, frozen-input models.
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow:v2.5@sha256:c87f1f6d9d4f62dc447844b58afe35f96af175bf933cb6cffbbbe39a59172360
remote_host: suva
remote_user: kyuhank
remote_base_dir: /home/kyuhank/KflowOutput
slot_requirements: 'regexp("^suvofp", Machine)'
resources:
  cpus: 2
  memory: 8GB
  disk: 20GB
exclude_machines: []
exclude_slots: []
env:
  ENSEMBLE_SELECT: ensemble-001
  PROGRAM_PATH: /home/mfcl/mfclo64
  BET_PHASE10_11_CONVERGENCE: "-4"
  TUNA_FLOW_RUNTIME_UPDATE: never
tags:
  stage: ensemble
  species: BET
  assessment_year: "2026"
  reference_model: Job-21641-S0.90-F2
output_patterns:
  - outputs/**
metadata:
  reference_model: Diagnostic Job 21641 (S0.90-F2)
  source_job: 21641
  fixed_tau: 2
  selectivity_model: F2
  initialization: ordinary-makepar-no-seed
  model_count: 100
  execution: independent-concurrent
  convergence: 1e-4
  inputs: frozen-and-preflight-verified
  tag_mixing_source_branch: SC22-IP10-regionMean
  tag_mixing_source_commit: efe3107c72774ee73b5e6dc45e44cf51f0fc20e8
